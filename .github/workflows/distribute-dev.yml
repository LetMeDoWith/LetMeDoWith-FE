name: distribute-dev

on:
  push:
    branches:
      - 'test/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '드라이런 — 빌드·알림까지만 하고 배포·태그·버전커밋은 건너뜀'
        type: boolean
        default: true

concurrency:
  group: distribute-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

# 드라이런: 실제 배포 없이 시크릿·빌드·서명·알림을 끝까지 검증한다.
# push로도 쓸 수 있게 커밋 메시지에 [dry-run]이 있으면 켜진다
# (workflow_dispatch는 워크플로우 파일이 기본 브랜치에 있어야 UI에 뜨므로,
#  머지 전에는 커밋 메시지 방식만 동작한다).
env:
  DRY_RUN: ${{ inputs.dry_run || contains(github.event.head_commit.message, '[dry-run]') }}

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.extract.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 브랜치명에서 버전 추출 및 semver 검증
        id: extract
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          VERSION="${BRANCH#test/}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::브랜치명 '${BRANCH}'에서 semver를 추출할 수 없습니다. 'test/X.Y.Z' 형식으로 브랜치를 만들어주세요."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - run: yarn install --frozen-lockfile

      - name: 버전 불일치 시 자동 커밋(기존 관례 2커밋) 후 push
        id: commit
        run: |
          VERSION="${{ steps.extract.outputs.version }}"
          CURRENT=$(node -p "require('./package.json').version")
          if [[ "$CURRENT" != "$VERSION" ]]; then
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "::notice::드라이런 — 버전 커밋을 만들지 않습니다 (${CURRENT} → ${VERSION} 예정)"
            else
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              npm version "$VERSION" --no-git-tag-version
              npx react-native-version --never-amend --skip-tag
              git add android ios
              git commit -m "chore: native version 업데이트(${VERSION})"
              git add package.json
              git commit -m "${VERSION}"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  release-notes:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.sha }}

      - name: 출시 노트 생성
        run: bash scripts/ci/release-notes.sh release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - run: yarn install --frozen-lockfile

      - name: .env 복원 (ENABLE_DEVTOOLS 켜고 PACKAGE_VERSION 동기화)
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          printf '%s\n' "$ENV_FILE" > .env
          sed -i 's/^ENABLE_DEVTOOLS=.*/ENABLE_DEVTOOLS=true/' .env
          sed -i "s/^PACKAGE_VERSION=.*/PACKAGE_VERSION=${{ needs.version.outputs.version }}/" .env

      - name: google-services.json(dev) 복원
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_DEV }}
        run: printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Android Release 빌드
        run: cd android && ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  ios:
    needs: version
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Xcode 버전 선택 (로컬 빌드 환경과 정렬)
        run: |
          # 로컬 수동 빌드는 Xcode 16.2 기준. 러너에 있으면 맞추고, 없으면 기본값(16.x)을 쓴다.
          if [ -d /Applications/Xcode_16.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          fi
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - run: yarn install --frozen-lockfile

      - name: .env / GoogleService-Info.plist(dev) 복원
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_DEV }}
        run: |
          printf '%s\n' "$ENV_FILE" > .env
          sed -i '' 's/^ENABLE_DEVTOOLS=.*/ENABLE_DEVTOOLS=true/' .env
          sed -i '' "s/^PACKAGE_VERSION=.*/PACKAGE_VERSION=${{ needs.version.outputs.version }}/" .env
          printf '%s\n' "$GOOGLE_SERVICE_INFO_PLIST" > ios/GoogleService-Info.plist

      - name: 배포 인증서를 임시 키체인에 로드
        env:
          IOS_CERT_P12: ${{ secrets.IOS_CERT_P12 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$IOS_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$IOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"

      - name: 프로비저닝 프로파일 설치
        env:
          IOS_PROVISIONING_PROFILES: ${{ secrets.IOS_PROVISIONING_PROFILES }}
        run: |
          # Xcode 버전에 따라 참조 경로가 달라 두 곳 모두에 설치한다
          LEGACY_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          MODERN_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$LEGACY_DIR" "$MODERN_DIR"
          echo "$IOS_PROVISIONING_PROFILES" | base64 -d | tar xzf - -C "$LEGACY_DIR"
          cp "$LEGACY_DIR"/*.mobileprovision "$MODERN_DIR/"
          echo "설치된 프로파일 $(ls "$LEGACY_DIR"/*.mobileprovision | wc -l)개"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Pod install
        run: cd ios && bundle exec pod install

      - name: Archive
        run: |
          cd ios && xcodebuild \
            -workspace LetMeDoWith.xcworkspace \
            -scheme LetMeDoWith \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/LetMeDoWith.xcarchive \
            archive

      - name: Export IPA (development)
        run: |
          cd ios && xcodebuild \
            -exportArchive \
            -archivePath build/LetMeDoWith.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions-ci.plist

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/build/ipa/*.ipa
          if-no-files-found: error

  distribute-notify:
    needs: [version, release-notes, android, ios]
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      BUILDS_OK: ${{ needs.android.result == 'success' && needs.ios.result == 'success' && needs.release-notes.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: actions/download-artifact@v4
        if: env.BUILDS_OK == 'true'
        with:
          path: dist

      - name: Firebase App Distribution 배포 (Android + iOS)
        if: env.BUILDS_OK == 'true' && env.DRY_RUN != 'true'
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s\n' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx firebase-tools@14 appdistribution:distribute \
            dist/android-apk/app-release.apk \
            --app "${{ secrets.FIREBASE_APP_ID_ANDROID }}" \
            --groups "${{ vars.FIREBASE_TESTER_GROUP }}" \
            --release-notes-file dist/release-notes/release-notes.md
          npx firebase-tools@14 appdistribution:distribute \
            "$(ls dist/ios-ipa/*.ipa | head -1)" \
            --app "${{ secrets.FIREBASE_APP_ID_IOS }}" \
            --groups "${{ vars.FIREBASE_TESTER_GROUP }}" \
            --release-notes-file dist/release-notes/release-notes.md

      - name: 배포 기준 태그 push
        if: env.BUILDS_OK == 'true' && env.DRY_RUN != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="dist-dev/${VERSION}-${{ github.run_number }}"
          git tag "$TAG"
          git push origin "$TAG"

      # 알림 실패로 잡을 실패시키지 않는다. 여기 도달한 시점엔 Firebase 배포·태그가
      # 이미 끝나 되돌릴 수 없으므로, 런이 빨개지면 "배포 실패"로 오인된다.
      - name: Discord 성공 알림
        if: env.BUILDS_OK == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          NOTES=dist/release-notes/release-notes.md
          if [[ "$DRY_RUN" == "true" ]]; then
            # 드라이런임을 노트 맨 위에 박아 실제 배포 알림과 헷갈리지 않게 한다
            printf '⚠️ 드라이런 — 실제 배포되지 않았습니다\n\n%s\n' "$(cat "$NOTES")" > "$NOTES"
          fi
          if ! bash scripts/ci/notify-discord.sh success "$VERSION" "$NOTES" "$RUN_URL"; then
            echo "::warning::Discord 알림 전송 실패 — 배포 자체는 완료됨"
          fi

      - name: Discord 실패 알림
        if: env.BUILDS_OK != 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          bash scripts/ci/notify-discord.sh failure "$VERSION" "$RUN_URL"
          echo "::error::빌드/노트 잡 실패 — android=${{ needs.android.result }}, ios=${{ needs.ios.result }}, release-notes=${{ needs.release-notes.result }}"
          exit 1
