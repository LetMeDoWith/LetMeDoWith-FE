name: distribute-dev

# 테스터 배포는 develop에서 수동으로 실행한다.
# 릴리즈마다 브랜치를 파던 방식은 기본 브랜치를 방치시키고 빌드 캐시를 매번 콜드로 만들었다.
# 설계 배경은 docs/superpowers/specs/2026-08-28-develop-trunk-release-strategy-design.md 참조.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: '올릴 버전 단위'
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: '드라이런 — 빌드까지만 하고 배포·태그·버전커밋은 건너뜀'
        type: boolean
        default: false

concurrency:
  group: distribute-dev
  cancel-in-progress: false

permissions:
  contents: write
  actions: write # 빌드 실패 시 런 전체를 취소(fail-fast)하기 위해 필요

env:
  DRY_RUN: ${{ inputs.dry_run }}

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: 다음 버전 계산
        id: bump
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          VERSION=$(npx --yes semver "$CURRENT" -i "${{ inputs.bump }}")
          echo "버전 ${CURRENT} → ${VERSION} (${{ inputs.bump }})"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - run: yarn install --frozen-lockfile

      - name: 버전 커밋(기존 관례 2커밋) 후 push
        id: commit
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "::notice::드라이런 — 버전 커밋을 만들지 않습니다 (${VERSION} 예정)"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            npm version "$VERSION" --no-git-tag-version
            # react-native-version에는 Android만 맡긴다. iOS 기본 모드는 Info.plist의
            # $(CURRENT_PROJECT_VERSION)·$(MARKETING_VERSION) 참조를 리터럴로 덮어쓰는데,
            # 참조 문자열은 parseInt가 NaN이라 빌드 번호가 1로 초기화된다(0.9.9 배포 때
            # 27 → 1로 떨어진 원인). agvtool을 쓰는 --legacy는 macOS 전용이라 못 쓴다.
            npx react-native-version --never-amend --skip-tag --target android
            # iOS는 pbxproj 빌드 세팅만 갱신한다. plist는 참조를 그대로 두면 빌드 시 해석된다.
            # 빌드 번호는 Android versionCode와 같은 값으로 맞춘다(0.9.8까지의 관례).
            VERSION_CODE=$(grep -oE 'versionCode [0-9]+' android/app/build.gradle | awk '{print $2}')
            sed -i "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = ${VERSION_CODE};/g" ios/LetMeDoWith.xcodeproj/project.pbxproj
            sed -i "s/MARKETING_VERSION = [0-9.]*;/MARKETING_VERSION = ${VERSION};/g" ios/LetMeDoWith.xcodeproj/project.pbxproj
            git add android ios
            git commit -m "chore: native version 업데이트(${VERSION})"
            git add package.json
            git commit -m "${VERSION}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build-apps.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ needs.version.outputs.sha }}
      upload-artifacts: true
      # 드라이런은 검증용이라 Discord로 내보내지 않는다.
      notify-on-failure: ${{ inputs.dry_run == false }}

  # 빌드가 모두 성공한 뒤에만 노트를 만든다.
  # 빌드가 실패하면 이 잡은 자동으로 스킵되고 파이프라인이 멈춘다.
  release-notes:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.sha }}

      - name: 출시 노트 생성
        run: bash scripts/ci/release-notes.sh release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  distribute-notify:
    needs: [version, release-notes, build]
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      BUILDS_OK: ${{ needs.build.result == 'success' && needs.release-notes.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: actions/download-artifact@v4
        if: env.BUILDS_OK == 'true'
        with:
          path: dist

      - name: Firebase App Distribution 배포 (Android + iOS)
        if: env.BUILDS_OK == 'true' && env.DRY_RUN != 'true'
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s\n' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx firebase-tools@14 appdistribution:distribute \
            dist/android-apk/app-release.apk \
            --app "${{ secrets.FIREBASE_APP_ID_ANDROID }}" \
            --groups "${{ vars.FIREBASE_TESTER_GROUP }}" \
            --release-notes-file dist/release-notes/release-notes.md
          npx firebase-tools@14 appdistribution:distribute \
            "$(ls dist/ios-ipa/*.ipa | head -1)" \
            --app "${{ secrets.FIREBASE_APP_ID_IOS }}" \
            --groups "${{ vars.FIREBASE_TESTER_GROUP }}" \
            --release-notes-file dist/release-notes/release-notes.md

      # 태그는 배포가 끝난 뒤에 만든다. 버전 커밋 시점에 만들면
      # release-notes.sh가 "가장 최근 v* 태그"를 방금 만든 태그로 잡아 범위가 비어버린다.
      - name: 배포 기준 태그 push
        if: env.BUILDS_OK == 'true' && env.DRY_RUN != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="v${VERSION}"
          git tag "$TAG"
          git push origin "$TAG"

      # 알림 실패로 잡을 실패시키지 않는다. 여기 도달한 시점엔 Firebase 배포·태그가
      # 이미 끝나 되돌릴 수 없으므로, 런이 빨개지면 "배포 실패"로 오인된다.
      - name: Discord 성공 알림
        if: env.BUILDS_OK == 'true' && env.DRY_RUN != 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          NOTES=dist/release-notes/release-notes.md
          if ! bash scripts/ci/notify-discord.sh success "$VERSION" "$NOTES" "$RUN_URL"; then
            echo "::warning::Discord 알림 전송 실패 — 배포 자체는 완료됨"
          fi

      - name: Discord 실패 알림
        if: env.BUILDS_OK != 'true' && env.DRY_RUN != 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          bash scripts/ci/notify-discord.sh failure "$VERSION" "$RUN_URL"
          echo "::error::빌드/노트 잡 실패 — build=${{ needs.build.result }}, release-notes=${{ needs.release-notes.result }}"
          exit 1
